# Tahap 2 A3 untuk pseudo hierarchy dari BatchTopK SAE pada protokol HiCEM.
experiment_name: kitchens_stage2_hicem_reported_clip_cached_batchtopk_a3
dataset: kitchens

data:
  data_root: datasets/PseudoKitchens

model:
  backbone: clip_vit_l14
  image_size: 224
  concept_dim: 16
