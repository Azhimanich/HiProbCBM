# Sanity check replikasi (Keputusan Desain Eksperimen #1): memakai
# classifier ANCHOR asli ProbCBM (Kim dkk., 2023) untuk memverifikasi
# hasil replikasi mendekati Tabel 1 paper asli (Task Acc 0.718, Concept
# Acc 0.956 pada CUB 299x299, ResNet18) SEBELUM classifier distandardisasi
# ke Linear+Softmax untuk perbandingan utama.
experiment_name: probcbm_cub_anchor_sanity_check
dataset: cub
baseline: probcbm

data:
  data_root: datasets/CUB_200_2011

model:
  backbone: resnet18
  image_size: 299
  concept_dim: 16
  classifier_head: anchor
