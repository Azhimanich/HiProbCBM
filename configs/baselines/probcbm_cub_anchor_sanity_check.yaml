# Ablasi classifier anchor pada adaptasi ProbCBM internal, bukan replikasi paper.
# Backbone/resolusi mengikuti probcbm_cub_resnet18.yaml agar hanya head berbeda.
experiment_name: probcbm_cub_anchor_sanity_check
dataset: cub
baseline: probcbm

data:
  data_root: datasets/CUB_200_2011

model:
  backbone: resnet18
  image_size: 224
  concept_dim: 16
  classifier_head: anchor

benchmark:
  protocol: adaptation_ablation
  comparison_group: cub_resnet18
