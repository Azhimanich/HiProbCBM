# ProbCBM dengan classifier head terstandardisasi (Linear+Softmax) -
# dipakai pada perbandingan utama Tabel 4.7 (Keputusan Desain Eksperimen #1).
experiment_name: probcbm_cub_inception
dataset: cub
baseline: probcbm

data:
  data_root: datasets/CUB_200_2011

model:
  backbone: inception_v3
  image_size: 299
  concept_dim: 16
  classifier_head: linear

benchmark:
  protocol: controlled_adaptation
  comparison_group: cub_inception_v3
