# Tahap 2 A3 untuk pseudo hierarchy dari BatchTopK SAE pada protokol ProbCBM.
experiment_name: cub_stage2_probcbm_reported_resnet18_batchtopk_a3
dataset: cub

data:
  data_root: datasets/CUB_200_2011
  # Salinan augmentasi/normalisasi ProbCBM (dataloaders/cub312_datamodule.py).
  transform: probcbm

model:
  backbone: resnet18
  image_size: 224
  concept_dim: 16
  pretrained: true
  n_mc_samples_train: 50
  n_mc_samples_eval: 50
  use_attention: true
  # Probabilitas induk = rata-rata prediksi langsung dan
  # soft-OR subkonsep, rumus HiCEM (cemcd/models/hicem.py).
  parent_probability: hicem_mix

train:
  batch_size: 128
  epochs_stage2: 20
  scheduler: cosine
  patience: null
  # Tahap class ProbCBM sequential (main.py, run_epoch.py, config_exp.yaml):
  # jalur konsep Tahap 1 dibekukan; kepala baru dilatih AdamP dengan
  # lr 1e-3 x lr_ratio 10, cosine, 20 epoch, clip 2.0, dan intervensi acak
  # anchor ground truth intervention_prob 0.5.
  stage2_init: stage1_frozen_concepts
  optimizer: adamp
  lr_stage2: 0.001
  lr_ratio: 10.0
  clip_grad_norm: 2.0
  intervention_training:
    mode: probcbm
    prob: 0.5

benchmark:
  type: reported_baseline_comparison
  baseline: ProbCBM
  source_commit: 912fc4e
  locked_contract: cub_class_attr_data_10_resnet18_224
