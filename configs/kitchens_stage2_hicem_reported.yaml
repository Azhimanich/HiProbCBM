# Stage 2 pasangan configs/kitchens_stage1_hicem_reported.yaml.
experiment_name: kitchens_stage2_hicem_reported_clip_cached
dataset: kitchens

data:
  data_root: datasets/PseudoKitchens

model:
  backbone: clip_vit_l14
  image_size: 224
  concept_dim: 16
  pretrained: true
  use_attention: true
  # Probabilitas induk mengikuti rumus HiCEM (cemcd/models/hicem.py).
  parent_probability: hicem_mix
  use_cached_features: true
  feature_cache_batch_size: 64

train:
  batch_size: 256
  epochs_stage2: 300
  # HiCEM (cemcd/training.py train_hicem, models/base.py, kitchens.yaml):
  # Adam lr 1e-3; concept loss weight 10 atas BCE gabungan top+sub dengan
  # bobot imbalance; early stopping 15 cek x 5 epoch = 75 epoch. HiCEM
  # dilatih dari awal, sehingga stage2_init tetap scratch.
  lr_stage2: 0.001
  lambda_concept: 10.0
  concept_loss_reduction: joint
  concept_loss_weighting: hicem_imbalance
  patience: 75
  # RandInt HiCEM (hicem.py): Bernoulli(0.25) atas kolom top concept + subkonsep.
  intervention_training:
    mode: hicem
    prob: 0.25

benchmark:
  type: reported_baseline_comparison
  baseline: HiCEM
  source_commit: 41802a5
  locked_contract: pseudokitchens_v2_clip_vitl14_frozen
