# Default lintas eksperimen (Bab IV.6 - Implementasi Model).
# Setiap file konfigurasi eksperimen (mis. configs/cub_stage1.yaml) hanya
# perlu menuliskan bagian yang BERBEDA dari default di sini.

seed: 42
log_dir: train_log

model:
  backbone: inception_v3       # inception_v3 | resnet18 | clip_vit_l14
  image_size: 299
  concept_dim: 16               # d_c (Bab IV.5.1.1)
  pretrained: true
  n_mc_samples_train: 8         # S saat training (Bab IV.6)
  n_mc_samples_eval: 32         # S saat pengujian, mengikuti konfigurasi ProbCBM
  use_attention: true           # false -> HiProbCBM-A1 (Tabel 4.8)
  embedding_dim: 16             # dipakai baseline CEM/HiCEM

train:
  batch_size: 32
  lr_stage1: 0.0001             # 1e-4 (Bab IV.6)
  lr_stage2: 0.00005            # 5e-5 (Bab IV.6)
  lr: 0.0001                    # dipakai baseline generik (train_baseline.py)
  epochs_stage1: 50
  epochs_stage2: 20
  epochs: 50                    # dipakai baseline generik
  lambda_kl: 0.00005            # 5e-5, mengikuti ProbCBM (Kim dkk., 2023)
  lambda_concept: 1.0
  lambda_sub: 1.0
  concept_weight: 1.0

sae:
  variant: kl                   # kl | batchtopk (Keputusan Desain Eksperimen #2)
  activation_threshold: 0.5     # tau (Bab IV.5.1.4)
  presence_threshold: 0.5       # ambang p_i untuk sample_filter (Bab IV.5.1.3)
  kwargs:
    latent_dim_ratio: 8         # rasio ekspansi dimensi laten (Bab IV.6)
  train_kwargs:
    n_epochs: 100
    batch_size: 256
    lr: 0.0003
