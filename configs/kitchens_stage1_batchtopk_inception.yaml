# HiProbCBM-A3 (varian SAE BatchTopK) pada PseudoKitchens, backbone
# Inception-v3 -- eksplorasi tambahan. Dipakai untuk kelompok
# "Ablasi (Inception-v3, PseudoKitchens)".

experiment_name: kitchens_stage1_batchtopk_inception
dataset: kitchens

data:
  data_root: datasets/PseudoKitchens

model:
  backbone: inception_v3
  image_size: 299
  concept_dim: 16

train:
  batch_size: 32

sae:
  variant: batchtopk
  kwargs:
    latent_dim_ratio: 8
    top_k: 32
    aux_top_k: 128
