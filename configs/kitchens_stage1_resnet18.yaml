# Tahap 1 HiProbCBM pada PseudoKitchens, backbone ResNet18 -- eksplorasi
# tambahan di luar Tabel 4.7 (backbone resmi Kitchens tetap CLIP ViT-L/14,
# lihat kitchens_stage1.yaml). Dipakai untuk kelompok
# "HiProbCBM (ResNet18, PseudoKitchens)".
#
# Siapkan manifest.csv + info.json lewat
# scripts/prepare_pseudokitchens_manifest.py sebelum menjalankan ini.

experiment_name: kitchens_stage1_resnet18
dataset: kitchens

data:
  data_root: datasets/PseudoKitchens

model:
  backbone: resnet18
  image_size: 224
  concept_dim: 16
  pretrained: true

train:
  batch_size: 32

sae:
  variant: kl
