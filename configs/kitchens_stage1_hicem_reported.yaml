# Konfigurasi HiProbCBM yang dipasangkan dengan hasil publikasi HiCEM.
experiment_name: kitchens_stage1_hicem_reported_clip_cached
dataset: kitchens

data:
  data_root: datasets/PseudoKitchens

model:
  backbone: clip_vit_l14
  image_size: 224
  concept_dim: 16
  pretrained: true
  # CLIP ViT-L/14 dibekukan dan diekstrak sekali ke Drive, sesuai protokol
  # source HiCEM. Epoch berikutnya membaca tensor fitur, bukan gambar mentah.
  use_cached_features: true
  feature_cache_batch_size: 64

train:
  batch_size: 256
  epochs_stage1: 300
  # Model awal HiCEM (cemcd/training.py train_cem, models/base.py,
  # experiments/configs/kitchens.yaml): Adam lr 1e-3, concept loss weight 10,
  # bobot imbalance, early stopping 15 cek x 5 epoch = 75 epoch.
  lr_stage1: 0.001
  lambda_concept: 10.0
  concept_loss_weighting: hicem_imbalance
  patience: 75

benchmark:
  type: reported_baseline_comparison
  baseline: HiCEM
  source_commit: 41802a5
  locked_contract: pseudokitchens_v2_clip_vitl14_frozen
