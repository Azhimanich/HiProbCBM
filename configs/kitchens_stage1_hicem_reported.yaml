# Konfigurasi HiProbCBM yang dipasangkan dengan hasil publikasi HiCEM.
experiment_name: kitchens_stage1_hicem_reported_clip
dataset: kitchens

data:
  data_root: datasets/PseudoKitchens

model:
  backbone: clip_vit_l14
  image_size: 224
  concept_dim: 16
  pretrained: true

train:
  batch_size: 64  # batas memori karena HiProbCBM menghitung encoder end-to-end; laporkan sebagai perbedaan dari cache HiCEM
  epochs_stage1: 300
  patience: 15

benchmark:
  type: reported_baseline_comparison
  baseline: HiCEM
  source_commit: 41802a5
  locked_contract: pseudokitchens_v2_clip_vitl14_frozen
