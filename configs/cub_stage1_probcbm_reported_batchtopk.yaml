# A3 untuk protokol ProbCBM reported: hanya metode discovery yang berubah.
experiment_name: cub_stage1_probcbm_reported_resnet18_batchtopk
dataset: cub

data:
  data_root: datasets/CUB_200_2011

model:
  backbone: resnet18
  image_size: 224
  concept_dim: 16
  pretrained: true
  n_mc_samples_train: 50
  n_mc_samples_eval: 50

train:
  batch_size: 128
  epochs_stage1: 50
  scheduler: cosine
  patience: null

sae:
  variant: batchtopk
  kwargs:
    latent_dim_ratio: 8
    top_k: 32
    aux_top_k: 128

benchmark:
  type: reported_baseline_comparison
  baseline: ProbCBM
  source_commit: 912fc4e
  locked_contract: cub_class_attr_data_10_resnet18_224
